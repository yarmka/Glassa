<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassa</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #6a8dff, #b46bff);
    color: #fff;
  }
  .card {
    padding: 32px 40px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Glassa</h1>
    <p>الموقع يشتغل ✅</p>
  </div>
</body>
</html>

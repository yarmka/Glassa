<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-theme-mode="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />

  <!-- SEO / social -->
  <meta name="description" content="Glassa — متجر ألعاب PC و Android. PC & Android games store." />
  <meta name="theme-color" content="#eef2ff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0c12" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta property="og:title" content="Glassa" />
  <meta property="og:description" content="متجر ألعاب PC و Android — PC & Android games store" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yarmka.github.io/glassa/" />

  <title>Glassa</title>

  <!-- Inline favicon (no extra request) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a8dff'/%3E%3Cstop offset='1' stop-color='%23b46bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E" />

  <!-- Fonts: preconnect for speed, single combined request -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!--
    Pre-paint bootstrap:
    Reads the saved language + theme from localStorage and applies them to
    <html> BEFORE the first paint to avoid the "flash of wrong theme/direction".
    Kept tiny and synchronous on purpose.
  -->
  <script>
    (function () {
      try {
        var html = document.documentElement;

        // ── Language
        var lang = localStorage.getItem("glassa.lang");
        if (lang !== "ar" && lang !== "en") lang = "ar";
        html.lang = lang;
        html.dir = lang === "ar" ? "rtl" : "ltr";

        // ── Theme
        var mode = localStorage.getItem("glassa.theme");
        if (mode !== "auto" && mode !== "light" && mode !== "dark") mode = "auto";
        var resolved = mode;
        if (mode === "auto") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        html.setAttribute("data-theme-mode", mode);
        html.setAttribute("data-theme", resolved);
      } catch (e) {
        /* fail silently — defaults from <html> still apply */
      }
    })();
  </script>
</head>

<body>
  <!-- Decorative animated background blobs (very subtle) -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <!--
    Main app mount point.
    app.js renders the shell (header / main / bottom nav) into this node.
  -->
  <div id="app" class="app-root" role="application"></div>

  <!-- Global portals (outside the reactive tree so they never re-render with views) -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root" class="modal-root"></div>

  <!-- Fallback for users with JS disabled -->
  <noscript>
    <div class="noscript">
      <h1>Glassa</h1>
      <p>يجب تفعيل JavaScript لاستخدام الموقع.</p>
      <p>You must enable JavaScript to use this site.</p>
    </div>
  </noscript>

  <!-- App entry point (ES module) -->
  <script type="module" src="app.js"></script>
</body>
</html>

name: Deploy Glassa Games
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build web app
        env:
          PORT: 4173
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build:web
      - name: SPA fallback
        run: cp artifacts/glassa-store/dist/public/index.html artifacts/glassa-store/dist/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/glassa-store/dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
